name: Checks

on:
  workflow_call:
    inputs:
      dsh_revision:
        description: Override the pinned DSH revision for this run
        type: string
        required: false
        default: ''

jobs:
  core:
    name: Core checks (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            node_architecture: arm64
          - name: macOS x64
            os: macos-15-intel
            node_architecture: x64
          - name: Linux x64
            os: ubuntu-24.04
            node_architecture: x64
          - name: Windows x64
            os: windows-2025
            node_architecture: x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          architecture: ${{ matrix.node_architecture }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Point at the requested DSH revision
        if: inputs.dsh_revision != ''
        run: node scripts/set-dsh-source.mjs "${{ inputs.dsh_revision }}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm run build

  runtime:
    name: Runtime smoke (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            desktop_smoke: true
            web_smoke: true
          - name: Windows x64
            os: windows-2025
            desktop_smoke: false
            web_smoke: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Point at the requested DSH revision
        if: inputs.dsh_revision != ''
        run: node scripts/set-dsh-source.mjs "${{ inputs.dsh_revision }}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install xvfb
        if: matrix.desktop_smoke
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build and stage the pinned runtime
        run: pnpm run build && pnpm run build:dsh && pnpm run stage:dsh

      - name: Smoke the web profile
        if: matrix.web_smoke
        run: pnpm run smoke:web

      - name: Smoke the desktop profile
        if: matrix.desktop_smoke
        run: xvfb-run -a pnpm run smoke:runtime
