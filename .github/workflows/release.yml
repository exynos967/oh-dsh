name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag。填 auto 按 package.json 发版；或填 vX.Y.Z / vX.Y.Z-rc.1。留空只打包不发 Release'
        required: false
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Resolve release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RAW_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          PUBLISH=false
          TAG=""

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RAW="${RAW_TAG-}"
            RAW="${RAW#"${RAW%%[![:space:]]*}"}"
            RAW="${RAW%"${RAW##*[![:space:]]}"}"
            if [ -n "$RAW" ]; then
              PUBLISH=true
              RAW_LC=$(printf '%s' "$RAW" | tr '[:upper:]' '[:lower:]')
              if [ "$RAW_LC" = "auto" ] || [ "$RAW_LC" = "latest" ]; then
                TAG="v$VERSION"
              else
                TAG="$RAW"
              fi
            fi
          else
            PUBLISH=true
            TAG="$REF_NAME"
          fi

          if [ "$PUBLISH" = "true" ]; then
            if [[ "$TAG" =~ ^[0-9] ]]; then
              TAG="v$TAG"
            fi
            if [[ ! "$TAG" =~ ^v[0-9] ]]; then
              echo "tag must look like v$VERSION or auto, got: $TAG"
              exit 1
            fi
            TAG_VERSION="${TAG#v}"
            if [ "$TAG_VERSION" != "$VERSION" ] && [[ "$TAG_VERSION" != "$VERSION"-* ]]; then
              echo "tag $TAG does not match package.json version $VERSION"
              echo "use v$VERSION, v$VERSION-<suffix>, or auto"
              exit 1
            fi
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "resolved tag=${TAG:-none} publish=$PUBLISH version=$VERSION"

  package:
    name: Package ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            id: macos-arm64
            os: macos-15
            dist_script: dist:mac
            node_platform: darwin
            node_arch: arm64
          - name: Linux x64
            id: linux-x64
            os: ubuntu-24.04
            dist_script: dist:linux
            node_platform: linux
            node_arch: x64
          - name: Windows x64
            id: windows-x64
            os: windows-2025
            dist_script: dist:win
            node_platform: win
            node_arch: x64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      DSH_DESKTOP_NODE_ARCH: ${{ matrix.node_arch }}
      DSH_DESKTOP_NODE_PLATFORM: ${{ matrix.node_platform }}
      npm_config_pm_on_fail: 'ignore'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          architecture: ${{ matrix.node_arch }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package desktop distribution
        run: pnpm run ${{ matrix.dist_script }}

      - name: Package Oh-DSH-Web distribution
        run: node scripts/build-web.mjs

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.id }}
          compression-level: 0
          path: |
            release/Oh-DSH-Desktop-*
            release/oh-dsh-web-*.tar.gz
            release/oh-dsh-web-*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [validate, package]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        run: gh release create "${{ needs.validate.outputs.tag }}" artifacts/* --generate-notes --target "${{ github.sha }}"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
