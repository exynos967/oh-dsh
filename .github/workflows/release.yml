name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag，例如 v0.1.3。留空则只打包上传 artifact，不创建 Release'
        required: false
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            id: macos-arm64
            os: macos-15
            dist_script: dist:mac
            node_platform: darwin
            node_arch: arm64
          - name: macOS x64
            id: macos-x64
            os: macos-15-intel
            dist_script: dist:mac:x64
            node_platform: darwin
            node_arch: x64
          - name: Linux x64
            id: linux-x64
            os: ubuntu-24.04
            dist_script: dist:linux
            node_platform: linux
            node_arch: x64
          - name: Windows x64
            id: windows-x64
            os: windows-2025
            dist_script: dist:win
            node_platform: win
            node_arch: x64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      DSH_DESKTOP_NODE_ARCH: ${{ matrix.node_arch }}
      DSH_DESKTOP_NODE_PLATFORM: ${{ matrix.node_platform }}
      npm_config_pm_on_fail: 'ignore'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          architecture: ${{ matrix.node_arch }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package desktop distribution
        run: pnpm run ${{ matrix.dist_script }}

      - name: Package Oh-DSH-Web distribution
        run: node scripts/build-web.mjs

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.id }}
          compression-level: 0
          path: |
            release/Oh-DSH-Desktop-*
            release/oh-dsh-web-*.tar.gz
            release/oh-dsh-web-*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: package
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve release tag
        id: release
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG='${{ inputs.tag }}'
          else
            TAG='${{ github.ref_name }}'
          fi
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            echo "tag must look like v0.1.3, got: $TAG"
            exit 1
          fi
          VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${TAG#v}"
          if [ "$TAG_VERSION" != "$VERSION" ] && [[ "$TAG_VERSION" != "$VERSION"-* ]]; then
            echo "tag $TAG does not match package.json version $VERSION"
            echo "artifact names use the package version; bump workspace packages first"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish release
        run: gh release create "${{ steps.release.outputs.tag }}" artifacts/* --generate-notes --target "${{ github.sha }}"
        env:
          GH_TOKEN: ${{ github.token }}
